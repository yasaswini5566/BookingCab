log4j.rootLogger=INFO, file1, file2, console

# TARGET LOG
log4j.appender.file1=org.apache.log4j.FileAppender
log4j.appender.file1.File=target/logs/test.log
log4j.appender.file1.layout=org.apache.log4j.PatternLayout
log4j.appender.file1.layout.ConversionPattern=%d [%t] %-5p %c - %m%n

# RUN (test-output) LOG - dynamic path
log4j.appender.file2=org.apache.log4j.FileAppender
log4j.appender.file2.File=${logfile.name}
log4j.appender.file2.layout=org.apache.log4j.PatternLayout
log4j.appender.file2.layout.ConversionPattern=%d [%t] %-5p %c - %m%n

# CONSOLE
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d %-5p %c - %m%n